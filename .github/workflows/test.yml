name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: docker pull python:3.12-slim
      - run: DREAM_TEST_DOCKER=1 python -m unittest discover -s tests -v
      - name: Build small prepared-workspace test base
        run: |
          docker build -t dream-test-prepared - <<'EOF'
          FROM python:3.12-slim
          RUN apt-get update && apt-get install -y --no-install-recommends git && rm -rf /var/lib/apt/lists/*
          EOF
      - run: DREAM_TEST_PREPARED_BASE=dream-test-prepared python -m unittest discover -s tests -p test_prepared_workspace.py -v
